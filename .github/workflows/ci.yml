name: CI

on:
  push:
    branches: [main, claude/aos-shell]
  pull_request:

jobs:
  build-and-test:
    # Public shared design library (assembly O.Ui), checked out beside this repo as o-ui.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aqc
      - uses: actions/checkout@v4
        with:
          repository: HolagundiWorks/O-UI
          path: o-ui
      # O-UI #3 left WidgetWindow internal and an ambiguous Path in PomodoroWidget;
      # CoreOp needs that tip for SuiteAppearance/SuiteDark. Patch until O-UI ships the fix.
      - name: Patch O-UI widget build break
        working-directory: o-ui
        shell: pwsh
        run: |
          $ww = 'O.Ui/Widgets/WidgetWindow.cs'
          $pom = 'O.Ui/Widgets/PomodoroWidget.cs'
          if (Test-Path $ww) {
            $t = Get-Content -Raw $ww
            $n = $t -replace '(?<!public )abstract class WidgetWindow', 'public abstract class WidgetWindow'
            if ($n -ne $t) { Set-Content -NoNewline -Path $ww -Value $n; Write-Host "Patched $ww (WidgetWindow public)" }
            else { Write-Host "WidgetWindow already public or missing pattern" }
          }
          if (Test-Path $pom) {
            $t = Get-Content -Raw $pom
            $n = $t -replace 'sealed class Arc : Path\b', 'sealed class Arc : Microsoft.UI.Xaml.Shapes.Path'
            if ($n -ne $t) { Set-Content -NoNewline -Path $pom -Value $n; Write-Host "Patched $pom (Path qualified)" }
            else { Write-Host "Pomodoro Path already qualified or missing pattern" }
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test import and Office.Shared libraries
        working-directory: aqc
        run: |
          dotnet test BBSDesktop/AQC.CadImport.Tests
          dotnet test BBSDesktop/Office.Shared.Tests
      - name: Build O-CoreOp
        working-directory: aqc
        run: dotnet build BBSDesktop/BBSApp/BBSApp.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=None
