name: CI

on:
  push:
    branches: [main, claude/aos-shell]
  pull_request:

jobs:
  build-and-test:
    # Public shared design library (assembly Hcw.Ui), checked out beside this repo as o-ui.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: aqc
      - uses: actions/checkout@v4
        with:
          repository: HolagundiWorks/O-UI
          path: o-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test import and Office.Shared libraries
        working-directory: aqc
        run: |
          dotnet test BBSDesktop/AQC.CadImport.Tests
          dotnet test BBSDesktop/Office.Shared.Tests
      - name: Build O-CoreOp
        working-directory: aqc
        run: dotnet build BBSDesktop/BBSApp/BBSApp.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=None
